name: Tests

on:
  push:
    branches:
      - ugaa-v2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sentencepiece transformers pillow pytest torch
          pip install -e .

      - name: Run logit-verification test suite
        run: |
          pytest tests/
