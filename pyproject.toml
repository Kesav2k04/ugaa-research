[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pope-audit"
version = "0.1.0"
description = "Token-set choice audit for POPE VLM hallucination evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Kesav Kumar Jayakumar", email = "kesavk659@gmail.com"},
    {name = "Karthigeyan Thilak", email = "karthik.suthraye@gmail.com"},
]
keywords = [
    "hallucination",
    "VLM",
    "POPE",
    "evaluation",
    "token-set",
    "LLaVA",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# --------------------------------------------------------------------------
# Core dependencies: only what src/pope_audit/ actually imports.
#
#   evaluate.py      → json, os                  (stdlib)
#   pope_loader.py   → json, os                  (stdlib)
#   ugaa_hook.py     → torch, torch.nn           (torch)
#   clip_l_grounding → torch, transformers        (torch + transformers)
#
# Torch is NOT listed here because PyPI torch wheels are
# platform/CUDA-specific.  Users must install torch separately
# from https://pytorch.org/get-started/locally/ before installing
# this package.  This is standard practice for research packages
# (see: detectron2, mmdet, flash-attn).
# --------------------------------------------------------------------------
dependencies = [
    "transformers>=4.41.2",
    "sentencepiece>=0.2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Full research stack: install with  pip install pope-audit[research]
research = [
    "accelerate>=0.28",
    "bitsandbytes>=0.43",
    "datasets>=2.18",
    "requests>=2.31",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/Kesav2k04/ugaa-research"
Repository = "https://github.com/Kesav2k04/ugaa-research"
Issues = "https://github.com/Kesav2k04/ugaa-research/issues"

# --------------------------------------------------------------------------
# Package discovery: src-layout
# --------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pope_audit = ["py.typed"]
